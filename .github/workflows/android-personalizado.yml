name: APK Android personalizado

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/android-personalizado.yml]

permissions:
  contents: read

concurrency:
  group: apk-personalizado-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'DrTiagoPinotte/free-my-tv' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check required secrets
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in TMDB_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure o Actions Secret $name. Consulte guides/APK-ANDROID-PT.md."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install isolated Android SDK 34
        run: |
          set -euo pipefail
          command -v zip >/dev/null
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$RUNNER_TEMP/freemytv-sdk/licenses"
          cp "$ANDROID_HOME"/licenses/* "$RUNNER_TEMP/freemytv-sdk/licenses/"
          # Do not use the runner's newer platforms: build.sh chooses the newest one.
          "$manager" --sdk_root="$RUNNER_TEMP/freemytv-sdk" \
            'build-tools;34.0.0' 'platforms;android-34' > "$RUNNER_TEMP/sdk-install.log" 2>&1 || {
              cat "$RUNNER_TEMP/sdk-install.log"; exit 1;
            }
          echo "ANDROID_HOME=$RUNNER_TEMP/freemytv-sdk" >> "$GITHUB_ENV"

      - name: Restore signing key and create temporary configuration
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/freemytv.keystore"
          # build.sh inserts this value into a Java string. Reject unexpected characters without echoing it.
          if [[ ! "$TMDB_KEY" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo '::error::TMDB_KEY deve conter somente a API Key ou o Read Access Token, sem prefixo Bearer ou espaços.'
            exit 1
          fi
          printf 'tmdb_key=%s\ntmdb_region=BR\nlanguage=pt\ncurrency=BRL\n' "$TMDB_KEY" > config.properties

      - name: Build with persistent signing key
        env:
          FREEMYTV_KEYSTORE: ${{ runner.temp }}/freemytv.keystore
          FREEMYTV_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # Keep compiler diagnostics private: generated Config.java contains the TMDB key.
          if ! bash build.sh > "$RUNNER_TEMP/freemytv-build.log" 2>&1; then
            echo '::error::Falha no build; detalhes privados foram omitidos para proteger a configuração.'
            exit 1
          fi

      - name: Validate APK, signature, certificate and alignment
        env:
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p apk-artifact
          "$bt/apksigner" verify --verbose --print-certs FreeMyTV.apk > apk-artifact/validation.txt
          "$bt/zipalign" -c -v 4 FreeMyTV.apk >> apk-artifact/validation.txt
          "$bt/aapt2" dump badging FreeMyTV.apk > apk-artifact/package.txt
          grep -q "package: name='io.freemytv'" apk-artifact/package.txt
          grep -q "sdkVersion:'26'" apk-artifact/package.txt
          grep -q "targetSdkVersion:'33'" apk-artifact/package.txt
          keytool -exportcert -keystore "$RUNNER_TEMP/freemytv.keystore" \
            -storepass:env SIGNING_PASSWORD -alias freemytv -file "$RUNNER_TEMP/signer.der" >/dev/null 2>&1
          expected="$(sha256sum "$RUNNER_TEMP/signer.der" | cut -d' ' -f1)"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apk-artifact/validation.txt)"
          [[ "$expected" == "$actual" ]]
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('FreeMyTV.apk') as apk:
              assert apk.testzip() is None, 'Corrupt APK'
              assert {'AndroidManifest.xml', 'classes.dex', 'resources.arsc'} <= set(apk.namelist())
          PY
          cp FreeMyTV.apk apk-artifact/
          (cd apk-artifact && sha256sum FreeMyTV.apk > FreeMyTV.apk.sha256)
          {
            echo '### APK personalizado validado'
            echo 'Baixe o ZIP em **Artifacts → FreeMyTV-APK** nesta execução e extraia **FreeMyTV.apk**.'
            echo "Commit: $GITHUB_SHA"
            echo "Certificado SHA-256: $actual"
            echo 'Configuração: região BR, idioma pt, moeda BRL. Assinatura e alinhamento verificados.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and verification reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FreeMyTV-APK
          path: apk-artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary secrets and build intermediates
        if: always()
        run: |
          rm -f config.properties "$RUNNER_TEMP/freemytv.keystore" "$RUNNER_TEMP/signer.der" "$RUNNER_TEMP/freemytv-build.log"
          rm -rf out
